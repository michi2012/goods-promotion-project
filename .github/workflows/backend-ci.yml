name: backend-ci

# 백엔드 모듈 테스트. 백엔드 관련 파일이 바뀐 PR에서만 실행한다 (문서·프론트만 바뀌면 실행 안 함).
# - 모듈별 job으로 병렬 실행하고, 한 모듈이 실패해도 다른 모듈은 계속 돈다 (fail-fast: false).
# - Gradle 빌드 캐시(--build-cache)가 입력이 바뀌지 않은 모듈의 테스트 결과를 재사용한다.
#   루트 빌드 설정이 바뀌면 입력이 달라져 자동으로 전체가 다시 돈다.
# - 캐시는 기본 브랜치(main)에서만 저장된다(setup-gradle 기본값). 그래서 main push에서도 실행해 캐시를 채운다.
# - 백엔드 E2E(backend-e2e/)는 전체 백엔드 환경이 필요해 여기서 돌리지 않는다 (백로그 BL-007).
on:
  # paths는 pull_request·push에 같은 목록을 둔다 (바꿀 때 두 곳을 함께 고칠 것)
  pull_request:
    branches: [dev, main]
    paths:
      - '*/src/**'
      - '!frontend/**'
      - '**/build.gradle'
      - '**/gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - '*/src/**'
      - '!frontend/**'
      - '**/build.gradle'
      - '**/gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [aiops, codebot, cs-bot, discovery-service, gateway-service, serverA, serverB, serverC, user-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test ${{ matrix.module }}
        run: |
          chmod +x ./gradlew
          ./gradlew :${{ matrix.module }}:test --build-cache
