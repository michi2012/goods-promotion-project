openapi: 3.1.0
info:
  title: Promotion — Purchase & Goods API
  version: 1.0.0
  description: >
    serverA가 제공하는 구매/상품 조회 API 계약.
    이 파일이 유일한 원본이다 — 백엔드 구현이 여기서 벗어나면 CI drift-check가 실패한다.
servers:
  - url: http://localhost:8080
    description: 로컬 serverA

paths:
  /api/v1/promotions/purchase:
    post:
      operationId: purchase
      summary: 구매 요청 (비동기 Saga 파이프라인 진입)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '202':
          description: 구매 요청 접수됨 (처리 대기중)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'

  /api/v1/goods/{goodsId}:
    get:
      operationId: getGoods
      summary: 상품 조회
      parameters:
        - name: goodsId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 상품 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsResponse'

  /api/v1/orders/{orderId}/refund:
    post:
      operationId: requestRefund
      summary: 주문 환불 요청 (주문 전체)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: X-User-Id
          in: header
          required: true
          description: 로그인 ID. 운영에서는 게이트웨이가 JWT를 검증해 넣는다
          schema:
            type: string
      responses:
        '200':
          description: 환불 접수됨 또는 이미 접수·완료됨 (멱등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '401':
          description: UNAUTHORIZED — X-User-Id 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ORDER_NOT_FOUND — 주문이 없거나 본인 주문이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: REFUND_NOT_ALLOWED_STATUS(PAID 아님) / REFUND_PERIOD_EXPIRED(결제 후 7일 초과)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: USER_LOOKUP_UNAVAILABLE — user-service 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    RefundResponse:
      type: object
      required:
        - orderId
        - status
      properties:
        orderId:
          type: string
        status:
          type: string
          enum:
            - REFUND_REQUESTED
            - REFUNDED
    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
      properties:
        status:
          type: integer
        error:
          type: string
          description: 에러 코드 (예 ORDER_NOT_FOUND)
        message:
          type: string
          description: 화면에 보여줄 문구
    PurchaseRequest:
      type: object
      required:
        - userId
        - goodsId
        - quantity
        - paymentMethod
        - shippingAddress
        - zipCode
        - phoneNumber
        - email
        - clientIp
      properties:
        userId:
          type: integer
          format: int64
        goodsId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
        paymentMethod:
          type: string
        shippingAddress:
          type: string
        zipCode:
          type: string
        phoneNumber:
          type: string
        email:
          type: string
        deliveryMemo:
          type: string
        clientIp:
          type: string
    PurchaseResponse:
      type: object
      required:
        - orderId
        - message
      properties:
        orderId:
          type: string
        message:
          type: string
    GoodsResponse:
      type: object
      required:
        - id
        - name
        - price
        - stock
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: integer
          format: int64
          description: 원 단위 가격 (KRW). 표시용 — 실제 청구 금액은 서버가 주문 저장 시 계산한다.
        stock:
          type: integer
