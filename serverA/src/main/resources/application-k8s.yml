eureka:
  client:
    enabled: false

# Eureka가 없는 K8s에서 PaymentQueryClient(DiscoveryClient)가 serverC를 찾을 수 있도록
# Spring Cloud 기본 SimpleDiscoveryClient에 K8s Service DNS를 정적 등록한다.
spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            serverC:
              - uri: http://server-c:8082
