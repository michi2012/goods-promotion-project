category: 환불정책
items:
  - question: 환불은 언제까지 가능한가요?
    answer: 결제 완료 후 7일 이내에 환불을 요청할 수 있습니다. 7일이 지나면 환불할 수 없습니다.
  - question: 환불 처리는 얼마나 걸리나요?
    answer: 환불 요청 접수 후 영업일 기준 3~5일 내 결제 수단으로 환불됩니다.
  - question: 부분 환불이 가능한가요?
    answer: 부분 환불은 할 수 없습니다. 환불은 주문 전체 단위로만 가능합니다.
  - question: 결제 후 단순 변심으로도 환불할 수 있나요?
    answer: 네, 사유와 관계없이 결제 완료 후 7일 이내라면 주문 전체를 환불할 수 있습니다.
