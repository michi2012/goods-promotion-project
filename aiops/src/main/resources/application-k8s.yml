eureka:
  client:
    enabled: false

# Eureka가 없는 K8s에서 CodebotClient(DiscoveryClient)가 codebot을 찾을 수 있도록
# Spring Cloud 기본 SimpleDiscoveryClient에 K8s Service DNS를 정적 등록한다.
spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            codebot:
              - uri: http://codebot:8087
